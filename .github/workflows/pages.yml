name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble site
        run: |
          mkdir _site
          for n in 1 2 3 4 5 9 z; do for z in *site-$n-*.zip; do unzip -oq "$z" -d _site; done; done
          git log --diff-filter=A --format= --name-only --reverse -- '*.zip' | grep -E '(years|update).*\.zip$' | awk '!seen[$0]++' | while IFS= read -r f; do if [ -f "$f" ]; then unzip -oq "$f" -d _site; fi; done
          echo "whitefriars.mx" > _site/CNAME
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
